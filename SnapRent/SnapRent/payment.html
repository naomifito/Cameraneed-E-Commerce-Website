<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pembayaran - SnapRent Multimedia</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-50 text-slate-900">
    <header class="border-b bg-white/80 backdrop-blur sticky top-0 z-20">
      <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-blue-900 text-white flex items-center justify-center font-semibold">S</div>
          <span class="font-semibold text-blue-900">SnapRent Multimedia</span>
        </a>
        <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
          <a href="index.html#hero" class="hover:text-blue-600">Beranda</a>
          <a href="catalog.html" class="hover:text-blue-600">Katalog</a>
          <a href="orders.html" class="hover:text-blue-600">Riwayat Order</a>
        </nav>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 text-sm">
      <a href="orders.html" class="inline-flex items-center gap-1 text-xs text-slate-600 hover:text-blue-700 mb-4">← Kembali ke riwayat</a>

      <header class="mb-4">
        <h1 class="text-2xl font-semibold text-blue-900 mb-1">Pembayaran QR</h1>
        <p class="text-xs text-slate-600">Scan QR code di bawah menggunakan aplikasi pembayaran pilihan Anda (dummy, tidak terhubung sistem nyata).</p>
      </header>

      <section id="payment-wrapper" class="bg-white rounded-lg border p-4 flex flex-col md:flex-row gap-5 items-start"></section>
    </main>

    <footer class="border-t bg-gray-50 mt-8">
      <div class="max-w-4xl mx-auto px-4 py-6 flex flex-col md:flex-row items-center justify-between gap-3 text-xs text-slate-600">
        <p>© <span id="year"></span> SnapRent Multimedia.</p>
        <a href="https://wa.me/6281219498744" target="_blank" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-md bg-yellow-300 text-blue-900 font-semibold hover:bg-yellow-400">WhatsApp Admin</a>
      </div>
    </footer>

    <script src="js/api-adapter.js"></script>
    <script src="app.js"></script>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();

      const wrapper = document.getElementById('payment-wrapper');

      function renderOrderItems(order) {
        // Handle both legacy orders (single product) and new orders (multiple products)
        if (order.items && Array.isArray(order.items)) {
          return `
            <div class="space-y-1 mb-1">
              ${order.items.map(item => {
                const product = window.App.findProductById(item.productId);
                if (!product) return '';
                return `<p class="text-xs text-slate-800">${product.name} ${item.quantity > 1 ? `<span class="text-[11px] text-slate-600">(${item.quantity}x)</span>` : ''}</p>`;
              }).join('')}
            </div>
          `;
        } else if (order.productId) {
          const product = window.App.findProductById(order.productId);
          return `<p class="text-xs text-slate-800">${product ? product.name : 'Produk tidak ditemukan'}</p>`;
        }
        return '<p class="text-xs text-slate-800">Produk tidak ditemukan</p>';
      }
      
      function renderOrderDurations(order) {
        // Legacy order dengan satu durasi global
        if (order.duration) {
          return `
            <div>
              <p class="text-[11px] text-slate-500 mb-0.5">Durasi</p>
              <p class="text-xs text-slate-800">${order.duration} hari</p>
            </div>
          `;
        }
        
        // Multi-item order dengan durasi per item
        if (order.items && Array.isArray(order.items)) {
          // Jika semua item memiliki durasi yang sama, tampilkan durasi tunggal
          const allDurations = order.items.map(item => item.duration || 1);
          const allSame = allDurations.every(d => d === allDurations[0]);
          
          if (allSame) {
            return `
              <div>
                <p class="text-[11px] text-slate-500 mb-0.5">Durasi</p>
                <p class="text-xs text-slate-800">${allDurations[0]} hari</p>
              </div>
            `;
          }
          
          // Jika durasi berbeda, tampilkan untuk masing-masing item
          return `
            <div>
              <p class="text-[11px] text-slate-500 mb-0.5">Durasi per item</p>
              <div class="space-y-1">
                ${order.items.map(item => {
                  const product = window.App.findProductById(item.productId);
                  const duration = item.duration || 1;
                  if (!product) return '';
                  return `<p class="text-[11px] text-slate-600">${product.name}: <span class="font-medium">${duration} hari</span></p>`;
                }).join('')}
              </div>
            </div>
          `;
        }
        
        // Fallback jika tidak ada informasi durasi
        return `
          <div>
            <p class="text-[11px] text-slate-500 mb-0.5">Durasi</p>
            <p class="text-xs text-slate-800">1 hari</p>
          </div>
        `;
      }
      
      function calculateTotal(order) {
        if (order.items && Array.isArray(order.items)) {
          return order.items.reduce((sum, item) => {
            const product = window.App.findProductById(item.productId);
            if (!product) return sum;
            // Gunakan durasi per item
            const itemDuration = item.duration || 1;
            return sum + (product.pricePerDay * item.quantity * itemDuration);
          }, 0);
        } else if (order.productId) {
          const product = window.App.findProductById(order.productId);
          const pricePerDay = product ? product.pricePerDay : 0;
          return pricePerDay * (order.duration || 1);
        }
        return 0;
      }

      function renderPayment() {
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('orderId');
        if (!orderId) {
          wrapper.innerHTML = '<p class="text-sm text-slate-600">Order tidak ditemukan.</p>';
          return;
        }
        const order = window.App.getOrderById(orderId);
        if (!order) {
          wrapper.innerHTML = '<p class="text-sm text-slate-600">Order tidak ditemukan.</p>';
          return;
        }
        
        // Calculate DP (30% dari total)
        const subtotal = calculateTotal(order);
        const dpAmount = Math.ceil(subtotal * 0.3);

        wrapper.innerHTML = `
          <div class="flex-1 space-y-3 text-xs">
            <div>
              <p class="text-[11px] text-slate-500 mb-0.5">ID Order</p>
              <p class="font-mono text-xs text-slate-800">${order.id}</p>
            </div>
            <div>
              <p class="text-[11px] text-slate-500 mb-0.5">Nama</p>
              <p class="text-xs text-slate-800">${order.fullName}</p>
            </div>
            <div>
              <p class="text-[11px] text-slate-500 mb-0.5">Produk</p>
              ${renderOrderItems(order)}
            </div>
            <div>
              <p class="text-[11px] text-slate-500 mb-0.5">Tanggal sewa</p>
              <p class="text-xs text-slate-800">${new Date(order.rentalDate).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' })}</p>
            </div>
            ${renderOrderDurations(order)}
            <div class="border-t pt-2 mt-2">
              <p class="text-[11px] text-slate-500 mb-0.5">Total sewa</p>
              <p class="text-base font-semibold text-blue-700">${window.App.formatPrice(subtotal)}</p>
              <p class="text-[11px] text-slate-600 mt-1.5 mb-1 font-medium">Pembayaran DP 30%</p>
              <p class="text-sm text-amber-700 font-semibold">${window.App.formatPrice(dpAmount)}</p>
              <p class="text-[11px] text-slate-500 mt-1">${order.items && order.items.length > 1 ? 'Harga total untuk semua item × durasi sewa' : 'Harga per hari × durasi sewa'}</p>
            </div>
            <div id="payment-confirmation-section" class="mt-3"></div>
          </div>
          <div class="w-full md:w-56 flex flex-col items-center gap-2">
            <div class="w-44 h-44 rounded-lg bg-slate-100 border flex items-center justify-center">
              <div class="w-32 h-32 bg-gradient-to-br from-blue-500 to-yellow-300 flex items-center justify-center text-[10px] font-medium text-white text-center px-2 flex flex-col justify-center">
                <div>QR PAYMENT</div>
                <div class="mt-1 font-mono text-[9px] bg-white/30 px-1 py-0.5 rounded">ORDER: ${order.id.substring(0, 8)}</div>
                <div class="mt-1 font-bold">${window.App.formatPrice(dpAmount)}</div>
              </div>
            </div>
            <p class="text-[11px] text-slate-500 text-center">Scan QR untuk membayar DP, lalu masukkan kode konfirmasi di atas.</p>
          </div>
        `;
      }

      renderPayment();
      
      // Sistem konfirmasi pembayaran dengan kode
      function setupPaymentConfirmation() {
        // Ambil order ID dari URL
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('orderId');
        if (!orderId) return;
        
        const order = window.App.getOrderById(orderId);
        if (!order) return;
        
        // Ambil elemen section konfirmasi
        const paymentSection = document.getElementById('payment-confirmation-section');
        if (!paymentSection) return;
        
        // Generate kode konfirmasi berdasarkan order ID
        function generatePaymentCode(orderId) {
          const hash = orderId.split('-').join('').substring(4, 10).toUpperCase();
          return hash.padEnd(6, '0').substring(0, 6);
        }
        
        const paymentCode = generatePaymentCode(orderId);
        
        // Tampilkan UI sesuai status pembayaran
        if (order.status === 'BERHASIL') {
          // Pembayaran sudah dikonfirmasi
          paymentSection.innerHTML = `
            <div class="border border-green-200 bg-green-50 text-green-800 px-3 py-2 rounded-md text-xs">
              <p class="font-medium mb-1">✅ Pembayaran DP Terkonfirmasi</p>
              <p class="text-[11px]">Pembayaran DP Anda telah dikonfirmasi. Terima kasih!</p>
            </div>
          `;
        } else {
          // Tahap 1: Tampilkan instruksi pembayaran dan tombol "Saya Sudah Bayar"
          paymentSection.innerHTML = `
            <div class="border border-amber-200 bg-amber-50 text-amber-800 px-3 py-2 rounded-md text-xs">
              <p class="font-medium mb-1">⚠️ Pembayaran Menunggu Konfirmasi</p>
              <p class="text-[11px] mb-3">Setelah melakukan pembayaran DP sebesar ${window.App.formatPrice(dpAmount)}, klik tombol di bawah untuk melanjutkan proses konfirmasi.</p>
              
              <button id="payment-completed" class="w-full px-3 py-1.5 bg-blue-600 text-white text-xs rounded font-medium hover:bg-blue-700">
                Saya Sudah Bayar
              </button>
            </div>
          `;
          
          // Setelah user mengklik "Saya Sudah Bayar", tampilkan kode konfirmasi
          setTimeout(() => {
            const paymentCompletedBtn = document.getElementById('payment-completed');
            if (!paymentCompletedBtn) return;
            
            paymentCompletedBtn.addEventListener('click', function() {
              paymentSection.innerHTML = `
                <div class="border border-amber-200 bg-amber-50 text-amber-800 px-3 py-2 rounded-md text-xs">
                  <p class="font-medium mb-1">🔑 Kode Konfirmasi Pembayaran: <span class="text-blue-900 bg-blue-100 px-1 py-0.5 rounded font-mono">${paymentCode}</span></p>
                  <p class="text-[11px] mb-2">Masukkan kode ini untuk mengkonfirmasi pembayaran Anda.</p>
                  
                  <div class="mt-2 flex items-center gap-2">
                    <input type="text" id="confirmation-code" placeholder="Masukkan kode di sini" class="text-xs border rounded px-2 py-1 w-full" maxlength="6">
                    <button id="confirm-payment" class="px-3 py-1 bg-blue-600 text-white text-xs rounded font-medium hover:bg-blue-700">Konfirmasi</button>
                  </div>
                  
                  <div id="error-message" class="hidden mt-1 text-[10px] text-red-600">Kode tidak valid. Silakan coba lagi.</div>
                </div>
              `;
              
              // Set up konfirmasi kode setelah tombol Konfirmasi muncul
              setupVerificationHandler(paymentCode, orderId, paymentSection);
            });
          }, 100);
        }
          
      }
      
      // Fungsi untuk mengatur verifikasi kode
      function setupVerificationHandler(paymentCode, orderId, paymentSection) {
        setTimeout(() => {
          const confirmBtn = document.getElementById('confirm-payment');
          const codeInput = document.getElementById('confirmation-code');
          const errorMsg = document.getElementById('error-message');
          
          if (!confirmBtn || !codeInput || !errorMsg) return;
          
          confirmBtn.addEventListener('click', function() {
            const enteredCode = codeInput.value.trim().toUpperCase();
            
            if (enteredCode === paymentCode) {
              // Update order status
              window.App.updateOrder({
                id: orderId,
                status: 'BERHASIL',
                updatedAt: new Date().toISOString()
              });
              
              // Show success message
              paymentSection.innerHTML = `
                <div class="border border-green-200 bg-green-50 text-green-800 px-3 py-2 rounded-md text-xs">
                  <p class="font-medium mb-1">✅ Pembayaran Berhasil Dikonfirmasi</p>
                  <p class="text-[11px]">Terima kasih! Pembayaran DP Anda telah dikonfirmasi.</p>
                </div>
                <a href="orders.html" class="mt-3 inline-flex justify-center px-4 py-2 rounded-md bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700">Kembali ke Pesanan Saya</a>
              `;
            } else {
              // Show error message
              errorMsg.classList.remove('hidden');
              codeInput.classList.add('border-red-300');
              setTimeout(() => {
                errorMsg.classList.add('hidden');
                codeInput.classList.remove('border-red-300');
              }, 3000);
            }
          });
        }, 100);
      }
      
      // Jalankan setup konfirmasi setelah halaman dimuat
      setupPaymentConfirmation();
    </script>
  </body>
</html>
