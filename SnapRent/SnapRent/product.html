<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Produk - SnapRent Multimedia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/api-adapter.js"></script>

  </head>
  <body class="bg-gray-50 text-slate-900">
    <header class="border-b bg-white/80 backdrop-blur sticky top-0 z-20">
      <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-blue-900 text-white flex items-center justify-center font-semibold">S</div>
          <span class="font-semibold text-blue-900">SnapRent Multimedia</span>
        </a>
        <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
          <a href="index.html#hero" class="hover:text-blue-600">Beranda</a>
          <a href="catalog.html" class="hover:text-blue-600">Katalog</a>
          <a href="orders.html" class="hover:text-blue-600">Riwayat Order</a>
          <a href="contact.html" class="hover:text-blue-600">Kontak</a>
        </nav>
        <a href="cart.html" id="cart-btn" class="hidden md:inline-flex items-center px-4 py-2 rounded-md bg-yellow-400 text-blue-900 text-sm font-semibold hover:bg-yellow-300">
          Keranjang <span id="cart-count" class="ml-1.5 inline-flex w-5 h-5 rounded-full bg-blue-900 text-white items-center justify-center text-xs">0</span>
        </a>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 text-sm">
      <a href="catalog.html" class="inline-flex items-center gap-1 text-xs text-slate-600 hover:text-blue-700 mb-4">← Kembali ke katalog</a>

      <div id="product-wrapper" class="bg-white rounded-lg border p-4 grid md:grid-cols-2 gap-5"></div>
    </main>

    <footer class="border-t bg-gray-50 mt-8">
      <div class="max-w-4xl mx-auto px-4 py-6 flex flex-col md:flex-row items-center justify-between gap-3 text-xs text-slate-600">
        <p>© <span id="year"></span> SnapRent Multimedia.</p>
        <a href="https://wa.me/6281219498744" target="_blank" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-md bg-yellow-300 text-blue-900 font-semibold hover:bg-yellow-400">WhatsApp Admin</a>
      </div>
    </footer>

    <script src="js/api-adapter.js"></script>
    <script src="app.js"></script>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();

      function renderProduct() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const wrapper = document.getElementById('product-wrapper');
        if (!id) {
          wrapper.innerHTML = '<p class="text-sm text-slate-600">Produk tidak ditemukan.</p>';
          return;
        }
        const product = window.App.findProductById(id);
        if (!product) {
          wrapper.innerHTML = '<p class="text-sm text-slate-600">Produk tidak ditemukan.</p>';
          return;
        }
        wrapper.innerHTML = `
          <div class="relative">
            <img src="${product.image}" alt="${product.name}" class="w-full h-56 md:h-64 object-cover rounded-md bg-slate-100 mb-3" />
            ${product.stock > 0 ? 
              `<div class="absolute top-3 right-3 px-2 py-1 rounded text-xs font-semibold ${product.stock <= 2 ? 'bg-amber-100 text-amber-800' : 'bg-green-100 text-green-800'}">
                ${product.stock <= 2 ? 'Stok: ' + product.stock : 'Tersedia'}
              </div>` : 
              `<div class="absolute top-3 right-3 px-2 py-1 rounded bg-red-100 text-red-800 text-xs font-semibold">
                Tidak Tersedia
              </div>`
            }
          </div>
          <div class="flex flex-col">
            <p class="text-xs uppercase tracking-wide text-blue-700 font-semibold mb-1">${product.category}</p>
            <h1 class="text-xl font-semibold text-blue-900 mb-2">${product.name}</h1>
            <p class="text-sm text-slate-600 mb-3">${product.specs}</p>
            <p class="text-base font-semibold text-blue-700 mb-4">${window.App.formatPrice(product.pricePerDay)}/hari</p>
            <div class="flex items-center gap-2 mb-4 text-xs">
              <span class="text-slate-600">Status:</span>
              ${product.isAvailable && product.stock > 0 ? 
                `<span class="text-green-600 font-medium">Tersedia untuk disewa</span>` : 
                `<span class="text-red-600 font-medium">Tidak tersedia</span>`
              }
            </div>
            <div class="mt-auto flex flex-col gap-2">
              <a href="order.html?productId=${product.id}" class="inline-flex justify-center px-4 py-2 rounded-md bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 ${(!product.isAvailable || product.stock <= 0) ? 'opacity-50 pointer-events-none cursor-not-allowed' : ''}">Pesan Sekarang</a>
              <button id="add-to-cart" data-product-id="${product.id}" class="inline-flex justify-center px-4 py-2 rounded-md bg-yellow-400 text-blue-900 text-sm font-semibold hover:bg-yellow-300 ${(!product.isAvailable || product.stock <= 0) ? 'opacity-50 cursor-not-allowed' : ''}" ${(!product.isAvailable || product.stock <= 0) ? 'disabled' : ''}>+ Tambah ke Keranjang</button>
              <a href="catalog.html" class="inline-flex justify-center px-4 py-2 rounded-md border border-slate-300 text-xs text-slate-700 hover:bg-slate-50">Lihat produk lain</a>
            </div>
          </div>
        `;
      }

      renderProduct();

      // Cart functionality
      const cartCount = document.getElementById('cart-count');
      const addToCartBtn = document.getElementById('add-to-cart');
      
      // Update cart count badge
      function updateCartCount() {
        const cart = window.App.loadCart();
        const count = cart.reduce((sum, item) => sum + item.quantity, 0);
        cartCount.textContent = count;
      }
      
      // Initialize
      updateCartCount();

      // Add to cart button
      if (addToCartBtn) {
        addToCartBtn.addEventListener('click', function() {
          const productId = this.dataset.productId;
          window.App.addToCart(productId);
          updateCartCount();
          
          // Show quick feedback
          const originalText = this.textContent;
          this.textContent = '✓ Ditambahkan';
          this.classList.add('bg-green-400');
          
          setTimeout(() => {
            this.textContent = originalText;
            this.classList.remove('bg-green-400');
          }, 1500);
        });
      }
    </script>
  </body>
</html>
