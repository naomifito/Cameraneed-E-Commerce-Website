<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katalog Produk - SnapRent Multimedia</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-slate-900">
    <header class="border-b bg-white/80 backdrop-blur sticky top-0 z-20">
      <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-blue-900 text-white flex items-center justify-center font-semibold">S</div>
          <span class="font-semibold text-blue-900">SnapRent Multimedia</span>
        </a>
        <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
          <a href="index.html#hero" class="hover:text-blue-600">Beranda</a>
          <a href="catalog.html" class="text-blue-700">Katalog</a>
          <a href="orders.html" class="hover:text-blue-600">Riwayat Order</a>
          <a href="contact.html" class="hover:text-blue-600">Kontak</a>
        </nav>
        <div class="flex items-center gap-2">
          <a href="cart.html" id="cart-btn" class="hidden md:inline-flex items-center px-4 py-2 rounded-md bg-yellow-400 text-blue-900 text-sm font-semibold hover:bg-yellow-300">
            Keranjang <span id="cart-count" class="ml-1.5 inline-flex w-5 h-5 rounded-full bg-blue-900 text-white items-center justify-center text-xs">0</span>
          </a>
          <a href="orders.html" class="hidden md:inline-flex px-4 py-2 rounded-md bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700">Riwayat Order</a>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
      <header class="mb-6">
        <p class="text-xs uppercase tracking-wide text-blue-700 font-semibold mb-1">Katalog Lengkap</p>
        <h1 class="text-2xl font-semibold text-blue-900 mb-1">Pilih Alat Multimedia</h1>
        <p class="text-sm text-slate-600">Klik "Pesan Sekarang" untuk langsung menuju form pemesanan, atau buka detail produk untuk spesifikasi singkat.</p>
      </header>

      <div id="catalog-container" class="space-y-8 text-sm"></div>
    </main>

    <footer class="border-t bg-gray-50 mt-8">
      <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col md:flex-row items-center justify-between gap-3 text-xs text-slate-600">
        <p>© <span id="year"></span> SnapRent Multimedia.</p>
        <div class="flex items-center gap-4">
          <a href="contact.html" class="hover:text-blue-700 font-medium">Kontak Admin</a>
          <a href="https://wa.me/6281219498744" target="_blank" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-md bg-yellow-300 text-blue-900 font-semibold hover:bg-yellow-400">
            <span>WhatsApp Admin</span>
          </a>
        </div>
      </div>
    </footer>

    <script src="js/api-adapter.js"></script>
    <script src="js/db-adapter.js"></script>
    <script src="app.js"></script>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();

      async function renderCatalog() {
        const container = document.getElementById('catalog-container');
        if (!window.App || !window.App.getCategories) {
          console.error('App not loaded properly');
          container.innerHTML = '<div class="bg-red-100 text-red-700 p-3 rounded">Error loading catalog data. Please refresh the page.</div>';
          return;
        }

        container.innerHTML = '<div class="text-center py-8 text-slate-500">Memuat katalog...</div>';
        
        const categories = await window.App.getCategories();
        const anchor = decodeURIComponent(window.location.hash.slice(1));

        container.innerHTML = categories
          .map((cat) => {
            const sectionId = encodeURIComponent(cat.name);
            const isHighlighted = anchor && anchor === cat.name;
            const cards = cat.items
              .map(
                (item) => {
                  const price = item.price_per_day || item.pricePerDay;
                  const id = item.product_id || item.id;
                  const isAvail = item.is_available === 1 || item.is_available === '1' || item.isAvailable;
                  const stock = typeof item.stock === 'string' ? parseInt(item.stock, 10) : item.stock;
                  const available = isAvail && stock > 0;
                  const stockLabel = !available
                    ? 'Tidak tersedia'
                    : stock <= 2
                      ? `Stok menipis (sisa ${stock})`
                      : `Tersedia (stok ${stock})`;

                  const stockBadgeClass = !available
                    ? 'bg-red-100 text-red-800'
                    : stock <= 2
                      ? 'bg-amber-100 text-amber-800'
                      : 'bg-green-100 text-green-800';

                  return `
                  <article class="bg-white rounded-lg border p-3 flex flex-col">
                    <div class="bg-blue-50 py-3 px-4 rounded-md mb-3 border-l-4 border-blue-600">
                      <h3 class="font-semibold text-blue-900 text-base">${item.name}</h3>
                      <div class="mt-1 flex items-center gap-2 flex-wrap">
                        <div class="px-1.5 py-0.5 inline-block rounded text-[10px] font-medium ${stockBadgeClass}">
                          ${stockLabel}
                        </div>
                        <div class="px-1.5 py-0.5 inline-block rounded bg-slate-100 text-slate-700 text-[10px] font-medium">
                          Stok: ${Number.isFinite(stock) ? stock : 0}
                        </div>
                      </div>
                    </div>
                    <p class="text-xs text-slate-600 mb-2 line-clamp-2">${item.specs}</p>
                    <p class="text-sm font-semibold text-blue-700 mb-3">${window.App.formatPrice(price)}/hari</p>
                    <div class="mt-auto flex items-center gap-2 text-xs">
                      <a href="product.html?id=${id}" class="flex-1 inline-flex justify-center px-3 py-1.5 rounded-md border border-slate-300 text-slate-700 hover:bg-slate-50">Detail</a>
                      <button data-product-id="${id}" class="add-to-cart flex-1 inline-flex justify-center px-3 py-1.5 rounded-md bg-yellow-400 text-blue-900 font-semibold hover:bg-yellow-300 ${(!available) ? 'opacity-50 cursor-not-allowed' : ''}" ${(!available) ? 'disabled' : ''}>+ Keranjang</button>
                      <a href="order.html?productId=${id}" class="flex-1 inline-flex justify-center px-3 py-1.5 rounded-md bg-blue-600 text-white font-semibold hover:bg-blue-700 ${(!available) ? 'opacity-50 pointer-events-none' : ''}">Pesan</a>
                    </div>
                  </article>
                `;
                }
              )
              .join('');

            return `
              <section id="${sectionId}" class="${isHighlighted ? 'ring-1 ring-blue-400 rounded-lg p-3 -mx-3 md:mx-0 md:p-0 md:ring-0' : ''}">
                <div class="flex items-center justify-between mb-3">
                  <h2 class="text-lg font-semibold text-blue-900">${cat.name}</h2>
                  <p class="text-xs text-slate-500">${cat.items.length} unit tersedia</p>
                </div>
                <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  ${cards}
                </div>
              </section>
            `;
          })
          .join('');
      }

      // Run renderCatalog after the page has fully loaded
      window.addEventListener('load', function() {
        renderCatalog();
        if (window.App && window.App.getCategories) {
          window.App.getCategories().then((cats) => {
            console.log('Catalog loaded, categories:', Array.isArray(cats) ? cats.length : 0);
          });
        }
      });

      // Cart functionality
      const cartCount = document.getElementById('cart-count');
      
      // Update cart count badge
      function updateCartCount() {
        const cart = window.App.loadCart();
        const count = cart.reduce((sum, item) => sum + item.quantity, 0);
        cartCount.textContent = count;
      }
      
      // Initialize
      updateCartCount();
      
      // Add event listeners to all "Add to Cart" buttons
      document.addEventListener('click', function(e) {
        if (e.target.closest('.add-to-cart')) {
          const button = e.target.closest('.add-to-cart');
          const productId = button.dataset.productId;
          window.App.addToCart(productId);
          updateCartCount();
          
          // Show quick feedback
          const originalText = button.textContent;
          button.textContent = '✓ Ditambahkan';
          button.classList.add('bg-green-400');
          
          setTimeout(() => {
            button.textContent = originalText;
            button.classList.remove('bg-green-400');
          }, 1500);
        }
      });
    </script>
  </body>
</html>
